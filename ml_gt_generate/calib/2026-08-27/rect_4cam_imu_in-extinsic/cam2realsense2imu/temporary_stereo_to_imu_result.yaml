# TEMPORARY RESULT — DO NOT USE AS A FINAL CALIBRATION.
# The RealSense infra1-to-color component uses the example D435i extrinsic
# from the official realsense-ros README, not this device's factory value.
# The existing color-to-IMU calibration also estimated near-zero translation
# and was previously identified as potentially degenerate.
#
# Convention: T_target_source maps points from source coordinates to target.
# Composition used:
#   T_imu_left  = inv(T_color_imu) * T_color_infra1 * inv(T_left_infra1)
#   T_imu_right = T_imu_left * inv(T_right_left)

inputs:
  realsense_example: temporary_d435i_readme_infra1_to_color.yaml
  infra1_to_left: calib_ir_20260814_192834-camchain-0.yaml
  left_to_right: calib_ir_20260814_192834-camchain-01.yaml
  imu_to_color: flight_data_2026_08_17-20_04_11_1-camchain-imucam.yaml

left_camera_to_imu:
  source_topic: /stereo_1_0/left/image_rect
  target_topic: /mavros/imu/data_raw
  convention: "T_imu_left (maps left-camera coordinates into IMU coordinates)"
  matrix:
    - [0.129186383391, 0.031445233936, 0.991121625837, 0.012333481140]
    - [-0.991529223923, -0.009451082801, 0.129539364214, -0.034066749813]
    - [0.013440568719, -0.999460779438, 0.029957918232, 0.052832213353]
